<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Selected works by Yilin An across concept art, 3D visual design, and game design.">
    <title>Works | Yilin An</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="works-page">
    <div class="page-shell">
      <header class="masthead">
        <div class="masthead__inner">
          <div class="edition">
            <span>Vol. 01 | Works Archive</span>
            <span>Concept & Visual / Game Design</span>
          </div>
          <div class="brand-row">
            <a class="brand" href="index.html">Yilin An</a>
            <nav class="main-nav" aria-label="Main navigation">
              <a class="nav-link" href="index.html">Front Page</a>
              <a class="nav-link" href="works.html">Works</a>
              <a class="nav-link" href="#contact">Contact</a>
            </nav>
          </div>
        </div>
      </header>

      <main>
        <section class="works-hero newsprint-texture">
          <div class="container">
            <div class="works-title">
              <div>
                <p class="eyebrow"><span class="red">Portfolio</span> files</p>
                <h1>Works.</h1>
              </div>
            </div>
            <div class="filters" aria-label="Project filters">
              <button class="filter-button is-active" data-filter="all">All files</button>
              <button class="filter-button" data-filter="concept">Concept & Visual</button>
              <button class="filter-button" data-filter="game">Game Design</button>
            </div>
          </div>
        </section>

        <section class="container">
          <div class="works-layout">
            <aside class="works-list" id="works-list" aria-label="Project list"></aside>
            <section class="work-detail" id="work-detail" aria-live="polite"></section>
          </div>
        </section>
      </main>

      <footer class="footer" id="contact">
        <div class="container">
          <div class="footer-grid">
            <div class="footer-copy">
              <p class="section-kicker red">Contact</p>
              <h2>Available for collaboration.</h2>
              <p>For indie games, art direction, worldbuilding, visual systems, and production-ready concept work.</p>
            </div>
            <div class="footer-contact">
              <p class="section-kicker">Direct Line</p>
              <div class="contact-list">
                <a href="mailto:elim.an@qq.com">elim.an@qq.com</a>
                <a href="tel:+4553520640">+45 53 52 06 40</a>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
